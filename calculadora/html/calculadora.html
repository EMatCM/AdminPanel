<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<link rel="icon" href="/images/calculadora.png" />
		<link rel="stylesheet" href="../css/calculadorastyles.css" />
	</head>
	<body>
		<div class="calculadora">
			<div class="pantalla">0</div>
			<div class="botones">
				<button id="c" class="bt">C</button>
				<button class="bt">/</button>
				<button class="bt">x</button>
				<button id="borrar" class="bt"><-</button>
				<button class="bt">7</button>
				<button class="bt">8</button>
				<button class="bt">9</button>
				<button class="bt">-</button>
				<button class="bt">4</button>
				<button class="bt">5</button>
				<button class="bt">6</button>
				<button class="bt">+</button>
				<button class="bt">1</button>
				<button class="bt">2</button>
				<button class="bt">3</button>
				<button id="igual" class="bt">=</button>
				<button id="cero" class="bt">0</button>
				<button class="bt">.</button>
			</div>
		</div>

		<script src="../js/calcu.js"></script>
	</body>
</html>
