<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gestión de Personas</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="cuadro">
			<div class="inter">
				<h1>Registro de Personas</h1>
				<label>Cédula</label>
				<input type="text" id="cedula" placeholder="Ingrese cédula" />

				<label>Nombres</label>
				<input type="text" id="nombre" placeholder="Ingrese nombre" />

				<label>Apellidos</label>
				<input type="text" id="apellido" placeholder="Ingrese apellidos" />

				<label>Correo Electrónico</label>
				<input type="email" id="email" placeholder="Ingrese correo" />

				<label>Telefono</label>
				<input type="tel" id="tel" placeholder="Ingrese número de teléfono" />

				<label>Sexo</label>
				<select id="sexo">
					<option value="Masculino">Masculino</option>
					<option value="Femenino">Femenino</option>
				</select>

				<label>Tipo</label>
				<select id="tipo">
					<option value="Admin">Admin</option>
					<option value="Usuario">Usuario</option>
				</select>

				<div class="botones">
					<button id="boton">Guardar Persona</button>
				</div>
			</div>
		</div>
		<script src="main.js"></script>
	</body>
</html>
